function integrations(){return pagehead('Duomenų mainai','Integracijos','Pasiūlyme numatyti duomenų mainų scenarijai su „Prorūna“ ir DVS „Kontora“.',`<button class="btn secondary" data-action="log">Klaidų žurnalas</button>`)+`<div class="integration"><article class="integration-card"><div class="integration-top"><span class="system-logo">PR</span>${badge('Prisijungta')}</div><h3>Apskaitos sistema „Prorūna“</h3><p>Patvirtintų prekių, turto ar apskaitos duomenų mainų scenarijus. Prototipe rodomas testinis sinchronizavimas.</p><div class="meta"><div><small>Paskutinis sinchronizavimas</small><strong id="proTime">Šiandien 06:00</strong></div><div><small>Perduota įrašų</small><strong>148</strong></div><div><small>Kryptis</small><strong>Prorūna → Sistema</strong></div><div><small>Klaidos</small><strong>0</strong></div></div><div class="form-actions"><button class="btn secondary small" data-action="config">Nustatymai</button><button class="btn teal small" data-action="sync" data-system="pro">Sinchronizuoti</button></div></article><article class="integration-card"><div class="integration-top"><span class="system-logo">KO</span>${badge('Prisijungta')}</div><h3>DVS „Kontora“</h3><p>Perdavimo ir nurašymo dokumentų bei metaduomenų perdavimas, dokumento registravimo arba pasirašymo būsenos gavimas.</p><div class="meta"><div><small>Paskutinis perdavimas</small><strong id="konTime">Vakar 16:42</strong></div><div><small>Dokumentai</small><strong>3</strong></div><div><small>Būsena</small><strong>Užregistruota</strong></div><div><small>Klaidos</small><strong>0</strong></div></div><div class="form-actions"><button class="btn secondary small" data-action="config">Nustatymai</button><button class="btn teal small" data-action="sync" data-system="kon">Tikrinti būsenas</button></div></article></div>`}
function admin(){return pagehead('Prieigos ir atsekamumas','Administravimas','Naudotojų rolės, klasifikatoriai, sistemos parametrai ir svarbių veiksmų audito istorija.',`<button class="btn teal" data-action="user">+ Naujas naudotojas</button>`)+`<article class="card"><div class="tabs"><button class="tab active" data-atab="roles">Rolės ir prieigos</button><button class="tab" data-atab="audit">Audito istorija</button><button class="tab" data-atab="dict">Žodynai ir parametrai</button></div><div class="cardbody" id="adminContent">${rolesContent()}</div></article>`}
function rolesContent(){return `<div class="grid equal">${[['Sandėlininkas','Priėmimas, likučiai, perdavimai ir inventorizacija'],['Pirkimų iniciatorius','Su jo atsakomybe susijęs turtas ir perdavimas'],['Padalinio vadovas','Padalinio turtas, perėmimas ir istorija'],['Ūkio skyriaus vadovas','Bendra būklė, sunaudojimas ir inventorizacija'],['Buhalterijos darbuotojas','Apskaitos informacija ir integracijų būsena'],['Administratorius','Naudotojai, teisės, žodynai ir visi moduliai']].map((x,i)=>`<div class="notice"><span class="detail-icon" style="width:34px;height:34px;font-size:11px">${i+1}</span><div><strong>${x[0]}</strong><small>${x[1]}</small></div></div>`).join('')}</div>`}function auditContent(){return `<div class="timeline">${s.audit.map(a=>`<div class="timeline-row"><time>${a.time}<br>Šiandien</time><span class="rail"><i></i></span><div><strong>${esc(a.action)}</strong><p>${esc(a.detail)} · <b>${esc(a.by)}</b></p></div></div>`).join('')}</div>`}function dictContent(){return `<div class="grid equal">${['Turto kategorijos · 6','Matavimo vienetai · 5','Lokacijos · 11','Padaliniai · 8','Turto būsenos · 7','Nurašymo priežastys · 9'].map((x,i)=>`<div class="notice"><span class="detail-icon" style="width:34px;height:34px;font-size:11px">${i+1}</span><div><strong>${x}</strong><small><button class="link" data-action="config">Redaguoti reikšmes</button></small></div></div>`).join('')}</div>`}
const pages={home,registry,receive,movement,inventory,reports,integrations,admin};function render(){renderNav();let n=nav.find(x=>x[0]===s.view);$('#crumb').textContent=n?n[2]:'Suvestinė';$('#app').innerHTML=(pages[s.view]||home)();bind();$('#sidebar').classList.remove('open')}
function go(v){s.view=v;save();render();window.scrollTo({top:0,behavior:'smooth'})}function toast(t){let e=document.createElement('div');e.className='toast';e.textContent=t;$('#toasts').append(e);setTimeout(()=>e.remove(),3200)}function modal(title,sub,body,foot){$('#modal').innerHTML=`<section class="modal" role="dialog" aria-modal="true"><header class="modal-head"><div><h2>${title}</h2>${sub?`<p>${sub}</p>`:''}</div><button class="close" data-action="close">×</button></header><div class="modal-body">${body}</div><footer class="modal-foot">${foot}</footer></section>`}function close(){$('#modal').innerHTML='';$('#drawer').innerHTML=''}
function barcode(seed){return [...seed.repeat(3)].map((c,i)=>`<i style="width:${(c.charCodeAt(0)+i)%4+1}px"></i>`).join('')}function qr(seed){let h='';for(let i=0;i<121;i++)h+=`<i class="${((seed.charCodeAt(i%seed.length)*7+i*11+i*i)%10)<5?'on':''}"></i>`;return h}
function detail(id){let i=s.items.find(x=>x.id===id);if(!i)return;$('#drawer').innerHTML=`<aside class="drawer"><header class="drawer-head"><div><h2>Turto kortelė</h2><p>${i.id} · ${i.cat}</p></div><button class="close" data-action="close">×</button></header><div class="drawer-body"><div class="detail-hero"><span class="detail-icon">${i.cat.slice(0,2).toUpperCase()}</span><div><h3>${esc(i.name)}</h3><p>${badge(i.status)}</p></div></div><div class="detail-grid"><div class="detail"><small>Tipas</small><strong>${esc(i.type)}</strong></div><div class="detail"><small>Kiekis</small><strong>${i.qty} ${i.unit}</strong></div><div class="detail"><small>Vieta</small><strong>${esc(i.place)}</strong></div><div class="detail"><small>Atsakingas</small><strong>${esc(i.owner)}</strong></div><div class="detail"><small>Padalinys</small><strong>${esc(i.dept)}</strong></div><div class="detail"><small>Vertė</small><strong>${eur(i.value)}</strong></div></div><div class="label"><div><h4>${esc(i.name)}</h4><p>Turto ir sandėlio valdymo sistema</p><div class="barcode">${barcode(i.id)}</div><p style="letter-spacing:.12em">${i.id}</p></div><div class="qr">${qr(i.id)}</div></div><div class="form-actions"><button class="btn secondary" data-action="print">${icon('tag')}Spausdinti etiketę</button><button class="btn teal" data-action="transfer" data-id="${i.id}">${icon('move')}Perkelti</button></div><article class="card" style="margin-top:16px"><div class="cardhead"><h3>Naujausias judėjimas</h3></div><div class="cardbody"><b>${esc(i.place)}</b><br><small>${esc(i.owner)} · būsena ${esc(i.status)}</small></div></article></div></aside>`}
function transfer(id=''){let item=s.items.find(x=>x.id===id)||s.items[0];modal('Naujas turto perdavimas','Bus sukurtas perdavimo aktas ir gavėjo patvirtinimo užduotis.',`<form id="transferForm"><div class="form-grid"><div class="field full"><label>Perduodamas objektas</label><select name="item">${s.items.map(i=>`<option value="${i.id}" ${i.id===item.id?'selected':''}>${i.id} · ${esc(i.name)}</option>`).join('')}</select></div><div class="field"><label>Iš kur</label><input name="from" value="${esc(item.place)}"></div><div class="field"><label>Į kur</label><select name="to"><option>Slaugos skyrius · 112 palata</option><option>Ambulatorija · 118 kab.</option><option>Administracija · 204 kab.</option><option>Pagrindinis sandėlis · A-03</option></select></div><div class="field"><label>Perdavėjas</label><input name="sender" value="Marius Norkus"></div><div class="field"><label>Perėmėjas</label><select name="receiver"><option>Inga Stonkutė</option><option>Agnė Jankauskaitė</option><option>Rasa Balčiūnienė</option><option>Darius Žukauskas</option></select></div></div></form>`,`<button class="btn secondary" data-action="close">Atšaukti</button><button class="btn teal" data-action="saveTransfer">Sukurti perdavimo aktą</button>`)}
function scan(){modal('Kodo nuskaitymas','Pasirinkite objektą, kurio kodo nuskaitymą norite imituoti.',`<div class="scanbox">${icon('scan')}<h3>Kamera paruošta</h3><p>Realiame sprendime kodas būtų nuskaitomas įrenginio kamera.</p><div class="field" style="max-width:420px;margin:15px auto 0"><select id="scanItem">${s.items.map(i=>`<option value="${i.id}">${i.id} · ${esc(i.name)}</option>`).join('')}</select></div></div>`,`<button class="btn secondary" data-action="close">Atšaukti</button><button class="btn teal" data-action="finishScan">Nuskaityti</button>`)}
function operation(){modal('Sunaudojimas arba nurašymas','Užregistruokite kiekį, padalinį ir operacijos priežastį.',`<form id="opForm"><div class="form-grid"><div class="field full"><label>Prekė arba turtas</label><select name="item">${s.items.map(i=>`<option value="${i.id}">${i.id} · ${esc(i.name)}</option>`).join('')}</select></div><div class="field"><label>Operacija</label><select name="kind"><option>Sunaudota</option><option>Nurašyta</option></select></div><div class="field"><label>Kiekis</label><input name="qty" type="number" value="1" min="1"></div><div class="field"><label>Padalinys</label><select name="dept"><option>Slaugos skyrius</option><option>Ambulatorija</option><option>Procedūrinis kabinetas</option><option>Administracija</option></select></div><div class="field"><label>Priežastis</label><input name="reason" value="Sunaudota veikloje"></div></div></form>`,`<button class="btn secondary" data-action="close">Atšaukti</button><button class="btn teal" data-action="saveOperation">Užregistruoti</button>`)}
function confirmTransfer(id){let t=s.transfers.find(x=>x.id===id);modal('Turto perėmimo patvirtinimas',t.id+' · vidinis patvirtinimas mobiliajame įrenginyje',`<div class="detail-grid"><div class="detail"><small>Objektas</small><strong>${esc(t.item)}</strong></div><div class="detail"><small>Perėmėjas</small><strong>${esc(t.receiver)}</strong></div><div class="detail"><small>Iš</small><strong>${esc(t.from)}</strong></div><div class="detail"><small>Į</small><strong>${esc(t.to)}</strong></div></div><label style="display:flex;gap:8px;align-items:flex-start;font-size:12px;margin-top:17px"><input type="checkbox" id="accept" style="margin-top:2px"> Patvirtinu, kad priėmiau nurodytą turtą.</label><p style="font-size:10px;color:var(--muted)">Šis patvirtinimas nėra kvalifikuotas elektroninis parašas.</p>`,`<button class="btn secondary" data-action="close">Atšaukti</button><button class="btn teal" data-action="approve" data-id="${id}">Patvirtinti perėmimą</button>`)}
function act(id){let t=s.transfers.find(x=>x.id===id);modal('Turto perdavimo–priėmimo aktas',t.id,`<div style="text-align:center;margin-bottom:18px"><b>TURTO IR SANDĖLIO VALDYMO SISTEMA</b><h3>TURTO PERDAVIMO–PRIĖMIMO AKTAS</h3><small>${t.date}</small></div><table class="table" style="border:1px solid var(--line)"><tr><th>Objektas</th><td>${esc(t.item)}</td></tr><tr><th>Perduodama iš</th><td>${esc(t.from)}</td></tr><tr><th>Perduodama į</th><td>${esc(t.to)}</td></tr><tr><th>Perėmėjas</th><td>${esc(t.receiver)}</td></tr><tr><th>Būsena</th><td>${badge(t.status)}</td></tr></table><p style="font-size:10px;color:var(--muted)">Dokumentas išsaugotas prie perdavimo operacijos. Jei reikalingas kvalifikuotas pasirašymas, dokumentas perduodamas į DVS „Kontora“.</p>`,`<button class="btn secondary" data-action="print">Spausdinti</button><button class="btn teal" data-action="sendKontora">Perduoti į „Kontora“</button>`)}
function simple(title,sub,body,ok='Išsaugoti'){modal(title,sub,body,`<button class="btn secondary" data-action="close">Atšaukti</button><button class="btn teal" data-action="generic">${ok}</button>`)}
function bind(){let f=$('#receiveForm');if(f)f.addEventListener('submit',e=>{e.preventDefault();let d=new FormData(f),id='NEW-'+String(s.items.length+1).padStart(4,'0'),i={id,name:d.get('name'),cat:d.get('cat'),type:d.get('type'),qty:+d.get('qty'),unit:d.get('unit'),place:d.get('place'),dept:d.get('dept'),owner:d.get('owner'),status:'Sandėlyje',value:+d.get('value')};s.items.unshift(i);s.movements.unshift({time:'Ką tik',item:i.name,code:i.id,from:'Tiekėjas',to:i.place,by:i.owner,kind:'Priėmimas'});save();toast('Priėmimas užregistruotas ir turto kortelė sukurta');go('registry')});let filter=()=>{let q=($('#regSearch')?.value||'').toLowerCase(),c=$('#catFilter')?.value||'',n=0;$$('#regRows tr').forEach(r=>{let ok=r.dataset.search.includes(q)&&(!c||r.dataset.cat===c);r.style.display=ok?'':'none';if(ok)n++});if($('#regCount'))$('#regCount').textContent=n+' įrašai'};$('#regSearch')?.addEventListener('input',filter);$('#catFilter')?.addEventListener('change',filter);$$('[data-mtab]').forEach(b=>b.addEventListener('click',()=>{$$('[data-mtab]').forEach(x=>x.classList.toggle('active',x===b));$('#moveContent').innerHTML=b.dataset.mtab==='transfer'?transferTable():b.dataset.mtab==='history'?historyTable():b.dataset.mtab==='operations'?operationsTable():cycles()}));$$('[data-atab]').forEach(b=>b.addEventListener('click',()=>{$$('[data-atab]').forEach(x=>x.classList.toggle('active',x===b));$('#adminContent').innerHTML=b.dataset.atab==='roles'?rolesContent():b.dataset.atab==='audit'?auditContent():dictContent()}))}
document.addEventListener('click',e=>{let x=e.target.closest('[data-view],[data-action]');if(!x)return;if(x.dataset.view){go(x.dataset.view);return}let a=x.dataset.action,id=x.dataset.id;if(a==='close')close();if(a==='detail')detail(id);if(a==='transfer')transfer(id);if(a==='scan')scan();if(a==='operation')operation();if(a==='confirm')confirmTransfer(id);if(a==='act')act(id);if(a==='print')window.print();if(a==='finishScan'){let id=$('#scanItem').value;close();toast('Kodas nuskaitytas');detail(id);if(s.view==='inventory'){s.inventory.checked++;s.inventory.matched++;save();render()}}if(a==='saveTransfer'){let d=new FormData($('#transferForm')),i=s.items.find(y=>y.id===d.get('item')),tid='PER-2026-'+String(92+s.transfers.length).padStart(3,'0');s.transfers.unshift({id:tid,item:i.name,from:d.get('from'),to:d.get('to'),receiver:d.get('receiver'),date:new Date().toISOString().slice(0,10),status:'Laukia patvirtinimo'});s.movements.unshift({time:'Ką tik',item:i.name,code:i.id,from:d.get('from'),to:d.get('to'),by:d.get('sender'),kind:'Perdavimas'});i.status='Perduodamas';save();close();toast('Perdavimo aktas sukurtas');go('movement')}if(a==='approve'){if(!$('#accept').checked){toast('Pažymėkite perėmimo patvirtinimą');return}let t=s.transfers.find(y=>y.id===id);t.status='Patvirtinta';let i=s.items.find(y=>y.name===t.item);if(i){i.place=t.to;i.owner=t.receiver;i.status='Naudojamas'}save();close();toast('Turto perėmimas patvirtintas');render()}if(a==='saveOperation'){let d=new FormData($('#opForm')),i=s.items.find(y=>y.id===d.get('item')),q=+d.get('qty'),kind=d.get('kind');i.qty=Math.max(0,i.qty-q);if(kind==='Nurašyta'&&i.qty===0)i.status='Nurašyta';s.operations.unshift({date:new Date().toISOString().slice(0,10),item:i.name,qty:q+' '+i.unit,dept:d.get('dept'),kind:kind+(kind==='Nurašyta'?' · '+d.get('reason'):''),by:'Asta T.'});save();close();toast('Operacija užregistruota');render()}if(a==='cycle')simple('Daugkartinės prekės ciklo veiksmas','Registruokite perdavimą, grąžinimą, naudojimą arba nurašymą.',`<div class="form-grid"><div class="field full"><label>Prekių grupė</label><select><option>Patalynės komplektai</option><option>Daugkartiniai chalatai</option></select></div><div class="field"><label>Veiksmas</label><select><option>Perdavimas</option><option>Grąžinimas</option><option>Naudojimas</option><option>Nurašymas</option></select></div><div class="field"><label>Kiekis</label><input type="number" value="1"></div></div>`,'Užregistruoti');if(a==='newinv')simple('Nauja inventorizacija','Pasirinkite vietą arba padalinį.',`<div class="form-grid"><div class="field full"><label>Vieta / padalinys</label><select><option>Vaistinė</option><option>Slaugos skyrius</option><option>Ambulatorija</option><option>Administracija</option></select></div><div class="field full"><label>Atsakingas darbuotojas</label><select><option>Marius Norkus</option><option>Lina Petraitienė</option></select></div></div>`,'Pradėti');if(a==='invhistory')simple('Inventorizacijų istorija','Ankstesnių inventorizacijų rezultatai.',`<div class="notice-list"><div class="notice"><i class="notice-dot" style="background:var(--green)"></i><div><strong>INV-2026-008 · Vaistinė</strong><small>Užbaigta 2026-09-29 · 1 neatitikimas</small></div></div><div class="notice"><i class="notice-dot" style="background:var(--green)"></i><div><strong>INV-2026-007 · Slaugos skyrius</strong><small>Užbaigta 2026-09-17 · be neatitikimų</small></div></div></div>`,'Uždaryti');if(a==='finishinv'){s.inventory.status='Užbaigta';save();toast('Inventorizacija užbaigta ir rezultatas išsaugotas');render()}if(a==='export')toast('Suvestinė paruošta atsisiuntimui');if(a==='sendKontora'){close();toast('Dokumentas perduotas į DVS „Kontora“')}if(a==='sync'){let el=x.dataset.system==='pro'?$('#proTime'):$('#konTime');if(el)el.textContent='Ką tik';toast(x.dataset.system==='pro'?'Duomenys sinchronizuoti':'Dokumentų būsenos atnaujintos')}if(a==='log')simple('Integracijų klaidų žurnalas','Neišspręstų klaidų šiuo metu nėra.',`<div class="empty"><b>Viskas veikia sklandžiai</b>Paskutiniai duomenų mainai užbaigti be klaidų.</div>`,'Uždaryti');if(a==='config')simple('Sistemos nustatymai','Pakeitimai prototipe išsaugomi tik demonstracijai.',`<div class="form-grid"><div class="field full"><label>Būsena</label><select><option>Įjungta</option><option>Išjungta</option></select></div><div class="field full"><label>Atnaujinimo dažnis</label><select><option>Kartą per parą</option><option>Rankiniu būdu</option></select></div></div>`);if(a==='user')simple('Naujas naudotojas','Priskirkite darbuotojui rolę ir prieigas.',`<div class="form-grid"><div class="field"><label>Vardas ir pavardė</label><input></div><div class="field"><label>El. paštas</label><input type="email"></div><div class="field full"><label>Rolė</label><select>${Object.keys(access).map(r=>`<option>${r}</option>`).join('')}</select></div></div>`,'Pridėti');if(a==='generic'){close();toast('Duomenys išsaugoti')}});
$('#role').addEventListener('change',e=>{s.role=e.target.value;save();toast('Įjungta rolė: '+s.role);render()});$('#menuBtn').addEventListener('click',()=>$('#sidebar').classList.toggle('open'));$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')close()});$('#drawer').addEventListener('click',e=>{if(e.target.id==='drawer')close()});document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});render();
</script>
</body>
</html>
